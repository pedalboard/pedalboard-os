name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bookworm
      env:
        HOME: /root
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts dpkg-dev curl ca-certificates

      - name: Build .deb
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifact
        run: |
          mkdir -p dist
          mv ../pedalboard-os_*.deb dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pedalboard-os-deb
          path: dist/pedalboard-os_*.deb

      - name: Publish rolling latest release (main branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest (main)
          prerelease: true
          files: dist/pedalboard-os_*.deb

      - name: Publish versioned release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/pedalboard-os_*.deb
